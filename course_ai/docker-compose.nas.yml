services:
  postgres:
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /volume1/docker/course-ai/data/postgres:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.nas
    restart: unless-stopped
    env_file: .env
    environment:
      # GitHub Pages is the browser origin that is allowed to call this API.
      FRONTEND_ORIGIN: https://wenzi-zhuang.github.io
      COURSE_ROOT: /library/financial_accounting
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /volume1/courses/financial_accounting:/volume1/courses/financial_accounting
      - /volume1/courses:/library
      - /volume1/docker/course-ai/config:/config
    ports:
      - "127.0.0.1:8000:8000"
